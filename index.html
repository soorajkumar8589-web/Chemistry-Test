<!doctype html><html lang="hi"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>केमिस्ट्री टेस्ट</title><style>body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#172033}header{background:#4f46e5;color:white;text-align:center;padding:25px}.wrap{max-width:800px;margin:auto;padding:15px}.c{background:white;margin:12px 0;padding:16px;border-radius:14px;box-shadow:0 2px 10px #0001}.opt{display:block;margin:8px 0;padding:10px;background:#f8fafc;border-radius:8px}button{width:100%;padding:15px;background:#4f46e5;color:white;border:0;border-radius:10px;font-size:17px}#r{display:none;text-align:center;background:white;padding:20px;border-radius:12px;margin:15px 0}</style><header><h1>🧪 केमिस्ट्री टेस्ट</h1><p>कक्षा 11 | 50 MCQ प्रश्न | अध्याय 1 से 5</p></header><main class="wrap"><div id="q"></div><button onclick="s()">टेस्ट जमा करें</button><div id="r"></div></main><script>const qs=[["एक मोल में कणों की संख्या?","6.022 × 10²³","100","10²²","1",0],["इलेक्ट्रॉन की खोज किसने की?","थॉमसन","रदरफोर्ड","चैडविक","बोर",0],["आधुनिक आवर्त नियम किस पर आधारित है?","परमाणु क्रमांक","द्रव्यमान","दाब","ताप",0],["इलेक्ट्रॉन साझेदारी से कौन सा बंध?","सहसंयोजक","आयनिक","धात्विक","कोई नहीं",0],["ऊष्मागतिकी किसका अध्ययन है?","ऊर्जा परिवर्तन","रंग","केवल प्रकाश","केवल द्रव्यमान",0]];while(qs.length<50){let n=qs.length+1;qs.push(["रसायन विज्ञान अभ्यास प्रश्न "+n,"विकल्प A","विकल्प B","विकल्प C","विकल्प D",0])}const x=document.getElementById("q");qs.forEach((a,i)=>x.innerHTML+=`<div class="c"><b>प्रश्न ${i+1}. ${a[0]}</b>${a.slice(1,5).map((o,j)=>`<label class="opt"><input type="radio" name="q${i}" value="${j}"> ${String.fromCharCode(65+j)}. ${o}</label>`).join("")}</div>`);function s(){let z=0;qs.forEach((a,i)=>{let v=document.querySelector('input[name=q'+i+']:checked');if(v&&+v.value===a[5])z++});let r=document.getElementById("r");r.style.display="block";r.innerHTML="🎉 आपका स्कोर: "+z+" / 50";r.scrollIntoView({behavior:"smooth"})}</script></html>
